name: Render template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render template + examples
        run: quarto render

      - name: Upload rendered output
        uses: actions/upload-artifact@v4
        with:
          name: rendered-output
          path: |
            *.pdf
            *.html
            example/*.pdf
            example/*.html
          retention-days: 7
