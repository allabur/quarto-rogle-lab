title: UPV Lab Assignment
author: Alberto Lacort
version: 2.0.0
quarto-required: ">=1.4.0"

contributes:
  format-resources:
    - resources/logos
    - resources/cc-icons

  formats:
    common:
      toc: true
      toc-depth: 3
      number-sections: true
      lang: es
      link-citations: true

    pdf:
      pdf-engine: xelatex
      documentclass: article
      papersize: a4
      fontsize: 11pt
      colorlinks: true
      keep-tex: false

      geometry:
        - top=25mm
        - left=25mm
        - right=25mm
        - bottom=35mm

      include-in-header:
        - includes/packages.tex
        - includes/colors.tex

      include-before-body:
        - includes/citation-callout.tex

      template-partials:
        - partials/title.tex
        - partials/before-title.tex

    html:
      theme:
        - default
        - styles/rogle-lab.scss
      toc-title: "Índice"
      code-fold: false
      code-tools: true
      fig-align: center
