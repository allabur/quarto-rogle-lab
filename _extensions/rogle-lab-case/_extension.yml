title: ROGLE Case / Informe (uso interno PDI)
author: Alberto Lacort
version: 0.2.0
quarto-required: ">=1.4.0"

# Formato de portada tipo artículo de congreso para casos docentes / notas
# técnicas del PDI de ROGLE pensados para depositar (RiUNET, Zenodo...). No
# es el formato que instala `quarto use template allabur/quarto-rogle-lab`
# para el enunciado de práctica de un alumno — ese sigue siendo la
# extensión `rogle-lab` (formatos rogle-lab-pdf / rogle-lab-html).
#
# v0.2 — el diseño (portada, licencia, "Cómo citar", cabecera/pie) se
# formaliza como clase LaTeX propia (rogle-case-upv.cls), al estilo de
# citym-upv.cls: temas intercambiables vía rogle-case-theme-<nombre>.tex,
# y este extension.yml solo carga la clase y traduce YAML → macros.

contributes:
  formats:
    pdf:
      pdf-engine: xelatex
      documentclass: rogle-case-upv
      colorlinks: true
      keep-tex: false
      toc: false
      number-sections: true
      lang: es
      link-citations: true

      filters:
        - rogle-lab-case.lua

      format-resources:
        - rogle-case-upv.cls
        - rogle-case-theme-default.tex

      include-before-body:
        - includes/citation-callout.tex

      template-partials:
        - partials/title.tex
